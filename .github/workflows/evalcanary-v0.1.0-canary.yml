name: ReplayDocket v0.2.0 External Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagged-consumer:
    name: tagged-consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify clean environment and set synthetic privacy marker
        run: python verify_canary.py prepare

      - name: Consume exact ReplayDocket tag
        id: evalcanary
        uses: lmdixon23/EvalCanary@v0.2.0
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        with:
          data: cases.jsonl
          before: verifier_before.py
          after: verifier_after.py
          policy: evalcanary.toml
          slice: metadata.domain
          output: tagged-pass-report

      - name: Verify all seven outputs and report safety
        env:
          STEP_OUTCOME: ${{ steps.evalcanary.outcome }}
          STEP_CONCLUSION: ${{ steps.evalcanary.conclusion }}
          REPORT_DIRECTORY: ${{ steps.evalcanary.outputs.report_directory }}
          REPORT_JSON: ${{ steps.evalcanary.outputs.report_json }}
          REPORT_MARKDOWN: ${{ steps.evalcanary.outputs.report_markdown }}
          REPORT_HTML: ${{ steps.evalcanary.outputs.report_html }}
          RUN_ID: ${{ steps.evalcanary.outputs.run_id }}
          CHANGED_CASES: ${{ steps.evalcanary.outputs.changed_cases }}
          POLICY_PASSED: ${{ steps.evalcanary.outputs.policy_passed }}
        run: python verify_canary.py pass

      - name: Upload successful report and output contract
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replaydocket-v0.2.0-pass-${{ matrix.os }}
          path: |
            tagged-pass-report
            canary-pass-contract.json
            canary-clean.json
          if-no-files-found: error
          retention-days: 14

  policy-failure:
    name: tagged-policy-failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify clean environment and set synthetic privacy marker
        run: python verify_canary.py prepare

      - name: Exercise exact tagged Action policy failure
        id: blocked
        continue-on-error: true
        uses: lmdixon23/EvalCanary@v0.2.0
        env:
          SOURCE_DATE_EPOCH: "1785960000"
        with:
          data: cases.jsonl
          before: verifier_before.py
          after: verifier_after.py
          policy: strict-policy.toml
          output: tagged-fail-report

      - name: Verify blocking outcome, all seven outputs and report safety
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.blocked.outcome }}
          STEP_CONCLUSION: ${{ steps.blocked.conclusion }}
          REPORT_DIRECTORY: ${{ steps.blocked.outputs.report_directory }}
          REPORT_JSON: ${{ steps.blocked.outputs.report_json }}
          REPORT_MARKDOWN: ${{ steps.blocked.outputs.report_markdown }}
          REPORT_HTML: ${{ steps.blocked.outputs.report_html }}
          RUN_ID: ${{ steps.blocked.outputs.run_id }}
          CHANGED_CASES: ${{ steps.blocked.outputs.changed_cases }}
          POLICY_PASSED: ${{ steps.blocked.outputs.policy_passed }}
        run: python verify_canary.py fail

      - name: Upload negative-control report and output contract
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replaydocket-v0.2.0-policy-fail-report
          path: |
            tagged-fail-report
            canary-fail-contract.json
            canary-clean.json
          if-no-files-found: error
          retention-days: 14

  canary-gate:
    name: canary-gate
    if: always()
    needs: [tagged-consumer, policy-failure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all canary jobs
        env:
          TAGGED_RESULT: ${{ needs.tagged-consumer.result }}
          POLICY_RESULT: ${{ needs.policy-failure.result }}
        run: |
          printf 'tagged-consumer: %s\n' "$TAGGED_RESULT"
          printf 'policy-failure: %s\n' "$POLICY_RESULT"
          test "$TAGGED_RESULT" = success
          test "$POLICY_RESULT" = success
